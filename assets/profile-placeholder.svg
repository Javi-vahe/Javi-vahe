<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
  <title id="title">Profile photo placeholder</title>
  <desc id="desc">A restrained graphite and green portrait placeholder with the initials ZG.</desc>

  <defs>
    <linearGradient id="bg" x1="52" y1="24" x2="510" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202833" />
      <stop offset="0.5" stop-color="#111820" />
      <stop offset="1" stop-color="#090E13" />
    </linearGradient>
    <linearGradient id="ring" x1="170" y1="176" x2="394" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91D65C" />
      <stop offset="1" stop-color="#3F7F50" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(438 118) rotate(128) scale(344 318)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79C650" stop-opacity="0.22" />
      <stop offset="1" stop-color="#79C650" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#A7B3C2" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <clipPath id="frame">
      <rect x="8" y="8" width="544" height="684" rx="34" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="544" height="684" rx="34" fill="url(#bg)" />
    <rect x="8" y="8" width="544" height="684" rx="34" fill="url(#grid)" />
    <rect x="8" y="8" width="544" height="684" rx="34" fill="url(#glow)" />

    <path d="M86 92H196" stroke="#8BD05A" stroke-width="4" stroke-linecap="round" />
    <circle cx="82" cy="92" r="5" fill="#8BD05A" />
    <path d="M364 608H474" stroke="#8BD05A" stroke-width="4" stroke-linecap="round" />
    <circle cx="478" cy="608" r="5" fill="#8BD05A" />

    <g filter="url(#shadow)">
      <circle cx="280" cy="292" r="116" fill="#0C1218" stroke="url(#ring)" stroke-width="3" />
      <circle cx="280" cy="292" r="98" fill="#17212A" stroke="#DCE7EF" stroke-opacity="0.12" />
    </g>

    <text x="280" y="315" text-anchor="middle" fill="#F2F7FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="3">ZG</text>

    <text x="280" y="477" text-anchor="middle" fill="#F0F5F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" letter-spacing="4">PROFILE PHOTO</text>
    <text x="280" y="517" text-anchor="middle" fill="#9EABB7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="1">replace with your portrait</text>

    <rect x="166" y="558" width="228" height="2" rx="1" fill="#8BD05A" fill-opacity="0.8" />
    <text x="280" y="646" text-anchor="middle" fill="#667482" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="2">ROBOTICS · EMBODIED AI</text>
  </g>

  <rect x="8.75" y="8.75" width="542.5" height="682.5" rx="33.25" fill="none" stroke="#CFD8E3" stroke-opacity="0.18" stroke-width="1.5" />
</svg>
